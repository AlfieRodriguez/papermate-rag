[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papermate-rag"
version = "0.1.0"
description = "A modular RAG system for academic paper reading."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "pydantic",
    "python-dotenv",
    "pytest",
    "pymupdf",
    "chromadb",
    "openai",
    "google-genai",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
